# This instance's domains. `team-ai assemble-manifest` merges this file into manifest.yaml.
domains:
  - id: arc-execution
    description: "Deterministic resolution of authored arcs and session transitions."
    keywords: [arc execution, authored arc, transition, runtime]
    not_owned: [knowledge state, character personality]
    kb_namespace: arc-execution
    subagent: arc-execution-sme
    group: engine
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: knowledge-graph
    description: "Who knows what, when they learned it, and from whom."
    keywords: [knowledge state, knows, learned, epistemic, knowledge graph]
    not_owned: [character personality, arc transitions]
    kb_namespace: knowledge-graph
    subagent: knowledge-graph-sme
    group: engine
    authority: canonical
    depends_on: [arc-execution, character-behavior]
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: character-behavior
    description: "Unified character identity, behavior, goals, and relationships."
    keywords: [character, behavior, personality, goals, relationships]
    not_owned: [knowledge graph, arc transitions]
    kb_namespace: character-behavior
    subagent: character-behavior-sme
    group: engine
    authority: canonical
    depends_on: [knowledge-graph]
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: model-routing
    description: "Provider-agnostic, cost-aware routing by task and quality tier."
    keywords: [model routing, provider agnostic, quality tier, cost]
    not_owned: [session state, content safety]
    kb_namespace: model-routing
    subagent: model-routing-sme
    group: engine
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: session-runtime
    description: "Session lifecycle, persistence, and structured runtime events."
    keywords: [session, persistence, lifecycle, events, runtime]
    not_owned: [arc authoring, model selection]
    kb_namespace: session-runtime
    subagent: session-runtime-sme
    group: engine
    authority: canonical
    depends_on: [arc-execution]
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: safety
    description: "Engine-layer content safety constraints and enforcement boundaries."
    keywords: [safety, moderation, constraint, policy]
    not_owned: [creative direction, model routing]
    kb_namespace: safety
    subagent: safety-sme
    group: engine
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: developer-api
    description: "Public API contracts, SDK boundaries, and developer integration."
    keywords: [api, sdk, developer, integration, contract]
    not_owned: [engine state transitions, dashboard rendering]
    kb_namespace: developer-api
    subagent: developer-api-sme
    group: engine
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: engine-sme
  - id: nightcap
    description: "Canonical Nightcap murder-mystery experience and story content."
    keywords: [nightcap, murder mystery, story bible, canon]
    not_owned: [engine architecture, archived couch race]
    kb_namespace: nightcap
    subagent: nightcap-sme
    group: title
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: title-sme
  - id: monster-rpg
    description: "Monster RPG title material, labelled as provisional until canonized."
    keywords: [monster rpg, monster, roleplaying]
    not_owned: [Nightcap canon, engine architecture]
    kb_namespace: monster-rpg
    subagent: monster-rpg-sme
    group: title
    authority: provisional
    model_tier: large
    owner: Nico Janssen
    escalate_to: title-sme
  - id: daily-case
    description: "Daily Case title material, labelled as provisional until canonized."
    keywords: [daily case, case of the day]
    not_owned: [Nightcap canon, engine architecture]
    kb_namespace: daily-case
    subagent: daily-case-sme
    group: title
    authority: provisional
    model_tier: large
    owner: Nico Janssen
    escalate_to: title-sme
  - id: nightcap-couch-race
    description: "Archived Couch Race variant; answers explain it is superseded."
    keywords: [couch race]
    not_owned: [Nightcap murder mystery]
    kb_namespace: nightcap-couch-race
    subagent: nightcap-couch-race-sme
    group: title
    authority: archived
    model_tier: large
    owner: Nico Janssen
    escalate_to: title-sme
  - id: product-roadmap
    description: "Product scope, roadmap decisions, and approved sequencing."
    keywords: [roadmap, product, scope, milestone, decision]
    not_owned: [implementation details, playtest operations]
    kb_namespace: product-roadmap
    subagent: product-roadmap-sme
    group: practice
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: practice-sme
  - id: engineering-practice
    description: "Engineering conventions, architecture practice, and delivery playbooks."
    keywords: [engineering practice, architecture, convention, playbook]
    not_owned: [product prioritization, title canon]
    kb_namespace: engineering-practice
    subagent: engineering-practice-sme
    group: practice
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: practice-sme
  - id: playtest-ops
    description: "Playtest preparation, harness operation, research, and publishing."
    keywords: [playtest, tester, harness, research, publishing]
    not_owned: [product approval, engine architecture]
    kb_namespace: playtest-ops
    subagent: playtest-ops-sme
    group: practice
    authority: canonical
    model_tier: large
    owner: Nico Janssen
    escalate_to: practice-sme

