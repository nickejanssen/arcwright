# Golden question set for Arcwright. Generated once, committed, refreshed when
# the knowledge base changes. See docs/superpowers/plans/2026-09-20-team-ai-agent-architecture-phase-b.md
#
# Two rules learned the hard way, both enforced by the coverage metric:
#
#  1. answer_evidence must be a LITERAL substring of the raw source file. It
#     must not span markdown markup: "**Current canonical source:**" means the
#     substring "Current canonical source: Checkpoint" does not exist.
#  2. Source evidence from stable canonical documents, not from a phase's own
#     planning documents. A question sourced from a spec being actively
#     rewritten breaks as soon as someone edits a sentence.
#
# Never lower the coverage gate to make a run pass. A failure names the question;
# fix the question or the document.
