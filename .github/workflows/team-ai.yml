name: team-ai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  team-ai:
    runs-on: ubuntu-latest
    env:
      # Explicitly select the runtime built from this checkout for PR validation.
      TEAM_AI_CLI: team-ai/runtime/dist/cli.js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: team-ai/runtime
      - name: Check whether runtime source changed
        id: runtime-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- team-ai/runtime/ .github/workflows/team-ai.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Runtime lint, types and tests
        if: steps.runtime-changes.outputs.changed == 'true'
        run: npm run check
        working-directory: team-ai/runtime
      - run: node team-ai/runtime/dist/cli.js validate-kb --instance team-ai
      - run: node team-ai/runtime/dist/cli.js validate-manifest --root team-ai
      - run: node team-ai/runtime/dist/cli.js assemble-manifest --root team-ai --check
      - name: emitted subagents match regeneration
        run: |
          # --search-command must match what the committed agents were emitted with,
          # or this check regenerates them with the framework default and fails.
          # Delete first: emit only writes, so an agent the framework stopped
          # emitting would otherwise survive in the repository unnoticed.
          rm -f .claude/agents/team-ai-*.md
          node team-ai/runtime/dist/cli.js emit --target claude-code --dir team-ai --out .. --file-prefix team-ai- --no-plugin-manifest --builtin-search --allow-tracked --search-command "python scripts/team_ai_cli.py"
          git status --porcelain -- .claude/agents
          test -z "$(git status --porcelain -- .claude/agents)"
      - name: no prior-namespace ids survive
        run: |
          ! git grep -n -E '^[[:space:]]*id:[[:space:]]*"?(operating|patterns|playbooks|custom|decisions|platform|unmapped)\.' -- . ':!docs/archive' ':!adoption-plan.yaml' ':!docs/adoption-plan.md' ':!team-ai/remap-proposal.yaml' ':!team-ai/inventory.txt' ':!team-ai/runtime'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: python test dependencies
        run: python -m pip install --quiet pytest
      - name: checker unit tests
        run: python -m pytest scripts/checks/tests/ scripts/hooks/tests/ scripts/tests/ -q
      - name: provider-leak-check
        run: python scripts/checks/provider_leak_check.py
      - name: knowledge-query-guard
        run: python scripts/checks/knowledge_query_guard.py
      - name: implemented-by-check
        run: python scripts/checks/implemented_by_check.py
      - name: scope-evidence-check
        run: python scripts/checks/scope_evidence_check.py --base origin/${{ github.base_ref || 'main' }}
      - name: eval gate
        run: node team-ai/runtime/dist/cli.js run-evals --root team-ai
