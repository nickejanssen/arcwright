name: team-ai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  team-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: nickejanssen/team-ai
          ref: v0.6.0
          path: .team-ai-cli
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: .team-ai-cli
      - run: node .team-ai-cli/dist/cli.js validate-kb --instance team-ai
      - run: node .team-ai-cli/dist/cli.js validate-manifest --root team-ai
      - name: emitted subagents match regeneration
        run: |
          node .team-ai-cli/dist/cli.js emit --target claude-code --dir team-ai --out .. --file-prefix team-ai- --no-plugin-manifest --builtin-search --allow-tracked
          git diff --exit-code -- .claude/agents
      - name: no prior-namespace ids survive
        run: |
          ! git grep -n -E '^[[:space:]]*id:[[:space:]]*"?(operating|patterns|playbooks|custom|decisions|platform|unmapped)\.' -- . ':!docs/archive' ':!adoption-plan.yaml' ':!docs/adoption-plan.md' ':!team-ai/remap-proposal.yaml' ':!team-ai/inventory.txt' ':!.team-ai-cli'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: checker unit tests
        run: python -m pytest scripts/checks/tests/ -q
      - name: provider-leak-check
        run: python scripts/checks/provider_leak_check.py
      - name: knowledge-query-guard
        run: python scripts/checks/knowledge_query_guard.py
      - name: scope-evidence-check
        run: python scripts/checks/scope_evidence_check.py --base origin/${{ github.base_ref || 'main' }}
      - name: eval gate
        run: node .team-ai-cli/dist/cli.js run-evals --root team-ai
