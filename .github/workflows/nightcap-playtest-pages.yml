name: Nightcap Playtest Pages
on:
  push:
    branches: [main]
    paths:
      - 'playtests/nightcap-paper-test-02-v2.2/**'
      - '.github/workflows/nightcap-playtest-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: playtests/nightcap-paper-test-02-v2.2
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
