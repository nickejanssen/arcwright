name: Nightcap Playtest Pages
on:
  push:
    branches: [main]
    paths:
      - 'playtests/catalog.json'
      - 'playtests/site/**'
      - 'playtests/nightcap-paper-test-02-v2.2/**'
      - 'scripts/build_playtest_site.py'
      - 'scripts/playtest_catalog.py'
      - 'scripts/tests/test_build_playtest_site.py'
      - 'scripts/tests/test_playtest_catalog.py'
      - '.github/workflows/nightcap-playtest-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Validate playtest catalog
        run: python scripts/playtest_catalog.py playtests/catalog.json
      - name: Test playtest site build
        run: python -m pytest scripts/tests/test_playtest_catalog.py scripts/tests/test_build_playtest_site.py -q
      - name: Build playtest site
        run: python scripts/build_playtest_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
